<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вспомним</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-family:serif;font-size:clamp(1.5rem,5vw,2.5rem);color:#e8c4c4;margin-bottom:30px;text-align:center;font-weight:400}
h1 em{font-style:italic;color:#d4a5a5}
.wrap{position:relative;width:min(90vw,450px);height:min(90vw,450px);display:flex;align-items:center;justify-content:center}
.wrap img{width:100%;height:100%;object-fit:contain;display:block}
.y{position:absolute;top:56%;left:50%;transform:translate(-50%,-50%);font-family:serif;font-size:clamp(1.3rem,3.5vw,1.8rem);font-weight:600;color:#4a3520;letter-spacing:2px;z-index:5;background:#c9b896;padding:2px 10px;border-radius:3px}
.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:4px;z-index:6;box-shadow:2px 2px 5px rgba(0,0,0,.3);pointer-events:none}
.hh{width:5px;height:26%;background:#1a1510;margin-left:-2.5px;transform:rotate(232deg);border-radius:3px 3px 0 0;animation:sh 3.5s cubic-bezier(.4,0,.2,1) forwards}
.hm{width:3px;height:35%;background:#1a1510;margin-left:-1.5px;transform:rotate(278deg);border-radius:2px 2px 0 0;animation:sm 3.5s cubic-bezier(.4,0,.2,1) forwards}
.hs{width:1.5px;height:38%;background:#3a2010;margin-left:-.75px;transform:rotate(195deg);opacity:.85;animation:ss 3.5s cubic-bezier(.4,0,.2,1) forwards}
.dot{position:absolute;width:12px;height:12px;background:#1a1510;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);z-index:7;box-shadow:0 2px 5px rgba(0,0,0,.35)}
@keyframes sh{0%{transform:rotate(232deg)}100%{transform:rotate(-128deg)}}
@keyframes sm{0%{transform:rotate(278deg)}100%{transform:rotate(-82deg)}}
@keyframes ss{0%{transform:rotate(195deg);opacity:.85}20%{opacity:1}100%{transform:rotate(-165deg);opacity:.7}}
.cap{margin-top:30px;color:rgba(212,165,165,.6);font-family:serif;letter-spacing:2px;text-align:center}
a{margin-top:25px;padding:14px 40px;border:1px solid rgba(212,165,165,.35);color:#e8c4c4;text-decoration:none;border-radius:50px;font-size:.75rem;letter-spacing:3px;text-transform:uppercase}
@media(max-width:480px){.wrap{width:min(95vw,380px);height:min(95vw,380px)}}
</style>
</head>
<body>
<h1>Вспомним, <em>как всё начиналось</em></h1>
<div class="wrap">
<img src="clock.png" alt="">
<div class="y">2025</div>
<div class="hand hh"></div><div class="hand hm"></div><div class="hand hs"></div>
<div class="dot"></div>
</div>
<p class="cap">Год назад всё было иначе...</p>
<a href="timeline.html">Продолжить</a>
</body>
</html>
