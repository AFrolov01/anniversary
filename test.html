<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#fff;height:100vh;width:100vw;overflow:hidden;position:relative}

.blur-spot{position:fixed;bottom:-180px;right:-180px;width:700px;height:700px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(120px);z-index:14;pointer-events:none}
.lilac-video{position:fixed;bottom:-40px;right:-40px;width:50vw;max-width:520px;z-index:15;pointer-events:none;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse 75% 75% at 65% 65%,black 30%,transparent 80%);mask-image:radial-gradient(ellipse 75% 75% at 65% 65%,black 30%,transparent 80%)}
@media(max-width:480px){.lilac-video{width:60vw;max-width:380px;bottom:-20px;right:-20px}.blur-spot{width:450px;height:450px;filter:blur(90px);bottom:-120px;right:-120px}}

#test-screen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:20px;opacity:0;transition:opacity 1.2s ease}
#test-screen.show{opacity:1}

.start-btn{display:inline-block;padding:20px 60px;border:2px solid #d4a5a5;color:#e8c4c4;background:rgba(10,10,15,.85);border-radius:50px;font-size:1.1rem;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:.4s;font-family:serif;z-index:20}
.start-btn:hover{border-color:#e8c4c4;box-shadow:0 0 35px rgba(212,165,165,.25);transform:translateY(-3px) scale(1.03)}
.start-btn.vanish{animation:vanish .8s ease forwards}
@keyframes vanish{0%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.15)}100%{opacity:0;transform:scale(0);pointer-events:none}}

.quiz{opacity:0;pointer-events:none;transition:opacity .8s ease;position:absolute;width:100%;max-width:550px;padding:20px;text-align:center;transform:translateY(20px)}
.quiz.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.quiz-label{font-family:serif;color:rgba(212,165,165,.5);letter-spacing:3px;font-size:.8rem;text-transform:uppercase;margin-bottom:25px}
.quiz-q{font-family:serif;font-size:clamp(1.3rem,4vw,2rem);color:#e8c4c4;margin-bottom:35px;line-height:1.4;font-weight:400}

.quiz-photo{width:min(85vw,400px);height:min(50vw,240px);object-fit:cover;border-radius:14px;margin:0 auto 30px;display:block;box-shadow:0 8px 30px rgba(0,0,0,.5);border:1px solid rgba(212,165,165,.15)}

.options{display:flex;flex-direction:column;gap:14px;align-items:center}
.opt{position:relative;width:100%;max-width:420px;padding:15px 22px;border:1px solid rgba(212,165,165,.25);color:#e8c4c4;background:rgba(10,10,15,.7);border-radius:14px;text-align:left;cursor:pointer;transition:.3s;font-size:1rem;font-family:serif;letter-spacing:1px;display:flex;align-items:center;gap:12px}
.opt:hover{border-color:#d4a5a5;box-shadow:0 0 20px rgba(212,165,165,.1);transform:translateX(5px)}

/* Кнопка play в варианте */
.play-btn{width:32px;height:32px;border:1px solid rgba(212,165,165,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:.2s;color:#d4a5a5;font-size:.7rem;background:transparent}
.play-btn:hover{border-color:#d4a5a5;background:rgba(212,165,165,.1)}
.play-btn.playing{border-color:#27ae60;color:#27ae60;background:rgba(39,174,96,.1)}

.opt-letter{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid rgba(212,165,165,.35);border-radius:50%;color:#d4a5a5;font-size:.8rem;font-weight:bold;flex-shrink:0;transition:.3s}
.opt:hover .opt-letter{border-color:#d4a5a5}

.opt-text{flex:1}

/* Прогресс-бар вокруг варианта при проигрывании */
.opt.playing-audio{border-color:rgba(212,165,165,.6);box-shadow:0 0 15px rgba(212,165,165,.08)}

.opt.wrong{background:rgba(180,40,40,.25);border-color:rgba(220,60,60,.6);animation:shakeOpt .4s ease}
.opt.wrong .opt-letter{background:rgba(220,60,60,.4);border-color:rgba(220,60,60,.8);color:#fff}
@keyframes shakeOpt{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.info-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:1.5px solid rgba(220,60,60,.8);border-radius:50%;color:rgba(220,60,60,.9);font-size:.65rem;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .3s;font-family:serif;font-weight:bold}
.opt.wrong .info-icon{opacity:1}
.info-icon:hover{background:rgba(220,60,60,.3)}
.tooltip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) translateY(4px);background:rgba(180,40,40,.95);color:#fff;padding:6px 14px;border-radius:8px;font-size:.75rem;font-family:system-ui,sans-serif;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30}
.tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(180,40,40,.95)}
.info-icon:hover .tooltip{opacity:1;transform:translateX(-50%) translateY(0)}

.opt.correct{background:rgba(40,140,60,.25);border-color:rgba(60,180,80,.6)}
.opt.correct .opt-letter{background:rgba(60,180,80,.4);border-color:rgba(60,180,80,.8);color:#fff}

.congrats{opacity:0;pointer-events:none;transition:opacity 1s ease;text-align:center;position:absolute}
.congrats.show{opacity:1;pointer-events:auto}
.congrats h2{font-family:serif;font-size:clamp(1.6rem,5vw,2.4rem);color:#e8c4c4;margin-bottom:15px}
.congrats p{color:rgba(255,255,255,.5);margin-bottom:35px}
.congrats-emoji{font-size:3.5rem;margin-bottom:20px;display:block}

.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;top:-60px;background:rgba(255,255,255,.12);border-radius:1px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="blur-spot"></div>
<video class="lilac-video" autoplay loop muted playsinline><source src="lilac.mp4" type="video/mp4"></video>

<div id="test-screen" class="show">
  <button class="start-btn" id="startBtn" onclick="startQuiz()">Начать тест</button>
  <div class="quiz" id="quiz"></div>
  <div class="congrats" id="congrats">
    <span class="congrats-emoji">🎉</span>
    <h2>Правильно!</h2>
    <p>Ты помнишь наши первые слова...</p>
    <a href="timeline.html" class="start-btn" style="margin-top:10px">Продолжить</a>
  </div>
</div>

<script>
// Меняй музыкальные файлы на свои! Правильный ответ — correct: true
const questions = [
  {
    label:'Вопрос 1 из 3',
    text:'Какое первое сообщение в нашем чате?',
    photo:null,
    options:[
      {letter:'а',text:'Привет',correct:true},
      {letter:'б',text:'Как дела?',correct:false},
      {letter:'г',text:'Ты кто',correct:false},
      {letter:'в',text:'Го в майн',correct:false}
    ]
  },
  {
    label:'Вопрос 2 из 3',
    text:'Угадай месяц по фото',
    photo:'october-photo.jpg',
    options:[
      {letter:'а',text:'Январь',correct:false},
      {letter:'б',text:'Август',correct:false},
      {letter:'в',text:'Март',correct:false},
      {letter:'г',text:'Октябрь',correct:true}
    ]
  },
  {
    label:'Вопрос 3 из 3',
    text:'Какую музыку в нашем чате мы послушали первую?',
    photo:null,
    audio:true, // аудио-вопрос
    // Замени music1-4.mp3 на свои файлы! Правильный — music3.mp3
    options:[
      {letter:'а',text:'',audio:'music1.mp3',correct:false},
      {letter:'б',text:'',audio:'music2.m4a',correct:false},
      {letter:'в',text:'',audio:'music3.mp3',correct:true},
      {letter:'г',text:'',audio:'music4.mp3',correct:false}
    ]
  }
];

let currentQ = 0;
let currentAudio = null;
let currentPlayBtn = null;
const quizEl = document.getElementById('quiz');
const congratsEl = document.getElementById('congrats');

function renderQuestion() {
  const q = questions[currentQ];
  let html = '<div class="quiz-label">' + q.label + '</div>';
  html += '<div class="quiz-q">' + q.text + '</div>';
  if(q.photo) html += '<img src="' + q.photo + '" class="quiz-photo" alt="">';
  html += '<div class="options">';
  q.options.forEach((opt,idx) => {
    const hasAudio = opt.audio ? true : false;
    html += '<div class="opt" data-idx="' + idx + '" onclick="checkAnswer(this,' + idx + ')">';
    if(hasAudio) {
      html += '<button class="play-btn" data-audio="' + opt.audio + '" onclick="toggleAudio(event,this)" title="Прослушать">&#9654;</button>';
    }
    html += '<span class="opt-letter">' + opt.letter + '</span>';
    if(opt.text) html += '<span class="opt-text">' + opt.text + '</span>';
    if(!opt.correct) html += '<div class="info-icon">i<div class="tooltip">Неправильно!</div></div>';
    html += '</div>';
  });
  html += '</div>';
  quizEl.innerHTML = html;
}

function toggleAudio(e, btn) {
  e.stopPropagation();
  const src = btn.dataset.audio;

  // Остановить текущее
  if(currentAudio && currentAudio.src.includes(src)) {
    if(currentAudio.paused) {
      currentAudio.play();
      btn.innerHTML = '&#10074;&#10074;';
      btn.classList.add('playing');
    } else {
      currentAudio.pause();
      btn.innerHTML = '&#9654;';
      btn.classList.remove('playing');
    }
    return;
  }

  // Остановить предыдущее
  if(currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  if(currentPlayBtn) {
    currentPlayBtn.innerHTML = '&#9654;';
    currentPlayBtn.classList.remove('playing');
  }

  // Запустить новое
  currentAudio = new Audio(src);
  currentAudio.loop = true;
  currentAudio.play();
  currentPlayBtn = btn;
  btn.innerHTML = '&#10074;&#10074;';
  btn.classList.add('playing');

  // При окончании сбросить
  currentAudio.onended = function() {
    btn.innerHTML = '&#9654;';
    btn.classList.remove('playing');
  };
}

function startQuiz() {
  document.getElementById('startBtn').classList.add('vanish');
  currentQ = 0;
  renderQuestion();
  setTimeout(() => quizEl.classList.add('show'), 500);
}

function checkAnswer(el, idx) {
  const q = questions[currentQ];
  const opt = q.options[idx];

  quizEl.querySelectorAll('.opt').forEach(o => {
    if(o !== el) o.classList.remove('wrong');
  });

  if(opt.correct) {
    el.classList.add('correct');
    // Остановить музыку при переходе
    if(currentAudio) { currentAudio.pause(); currentAudio = null; }
    if(currentPlayBtn) { currentPlayBtn = null; }

    setTimeout(() => {
      if(currentQ < questions.length - 1) {
        quizEl.classList.remove('show');
        setTimeout(() => {
          currentQ++;
          renderQuestion();
          quizEl.classList.add('show');
        }, 500);
      } else {
        quizEl.classList.remove('show');
        setTimeout(() => congratsEl.classList.add('show'), 500);
      }
    }, 800);
  } else {
    el.classList.add('wrong');
  }
}

// Частицы
const container = document.getElementById('particles');
for(let i=0;i<50;i++){
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random()*100+'%';
  p.style.width = (Math.random()*2+1)+'px';
  p.style.height = (Math.random()*12+4)+'px';
  p.style.opacity = Math.random()*.3+.05;
  p.style.animationDuration = (Math.random()*8+4)+'s';
  p.style.animationDelay = (Math.random()*10)+'s';
  container.appendChild(p);
}
</script>
</body>
</html>
