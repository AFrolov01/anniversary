<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Один год</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#fff;height:100vh;width:100vw;overflow:hidden;position:relative}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;top:-20px;background:rgba(255,255,255,.15);border-radius:1px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
#cover{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}
.badge{border:1px solid rgba(212,165,165,.3);padding:8px 24px;border-radius:30px;font-size:.75rem;letter-spacing:4px;text-transform:uppercase;color:#d4a5a5;margin-bottom:40px;opacity:0;transform:translateY(20px);animation:fu 1s ease forwards}
h1{font-family:serif;font-size:clamp(2rem,8vw,4rem);font-weight:300;line-height:1.2;margin-bottom:20px;opacity:0;transform:translateY(30px);animation:fu 1.2s ease forwards .3s}
h1 span{color:#d4a5a5;font-style:italic}
p{color:rgba(255,255,255,.5);line-height:1.8;margin-bottom:40px;max-width:500px;opacity:0;transform:translateY(20px);animation:fu 1s ease forwards .6s}
.date{color:rgba(212,165,165,.7);margin-bottom:50px;letter-spacing:2px;opacity:0;animation:fu 1s ease forwards .9s}
a{display:inline-block;padding:16px 50px;border:1px solid rgba(212,165,165,.4);color:#e8c4c4;text-decoration:none;border-radius:50px;letter-spacing:3px;font-size:.85rem;transition:.3s;opacity:0;transform:translateY(20px);animation:fu 1s ease forwards 1.2s}
a:hover{border-color:#d4a5a5;box-shadow:0 0 30px rgba(212,165,165,.15);transform:translateY(-2px)}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){h1{font-size:2.2rem}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div id="cover">
<div class="badge">Годовщина</div>
<h1>Один год.<br>Тысячи километров.<br><span>Одна история.</span></h1>
<p>Я собрал всё, что помню.<br>Все голосовые, все ночи, все «спокойной ночи».<br>Это для тебя.</p>
<div class="date">29 мая 2025 — 29 мая 2026</div>
<a href="clock.html">Открыть воспоминания</a>
</div>
<script>
const container=document.getElementById('particles');
for(let i=0;i<60;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.left=Math.random()*100+'%';
  p.style.width=(Math.random()*2+1)+'px';
  p.style.height=(Math.random()*12+4)+'px';
  p.style.opacity=Math.random()*.3+.05;
  p.style.animationDuration=(Math.random()*8+4)+'s';
  p.style.animationDelay=(Math.random()*10)+'s';
  container.appendChild(p);
}
</script>
</body>
</html>
