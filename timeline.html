<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>История</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#fff;height:100vh;width:100vw;overflow:hidden;position:relative}
.blur-spot{position:fixed;bottom:-180px;right:-180px;width:700px;height:700px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(120px);z-index:14;pointer-events:none}
.lilac-video{position:fixed;bottom:-40px;right:-40px;width:50vw;max-width:520px;z-index:15;pointer-events:none;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse 75% 75% at 65% 65%,black 30%,transparent 80%);mask-image:radial-gradient(ellipse 75% 75% at 65% 65%,black 30%,transparent 80%)}
@media(max-width:480px){.lilac-video{width:60vw;max-width:380px;bottom:-20px;right:-20px}.blur-spot{width:450px;height:450px;filter:blur(90px);bottom:-120px;right:-120px}}
#timeline{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}
h1{font-family:serif;font-size:clamp(2rem,6vw,3.5rem);font-weight:300;color:#e8c4c4;margin-bottom:20px}
p{color:rgba(255,255,255,.5);line-height:1.8;margin-bottom:40px;max-width:500px}
.date{color:rgba(212,165,165,.7);letter-spacing:2px;margin-bottom:30px}
.back{display:inline-block;padding:12px 40px;border:1px solid rgba(212,165,165,.4);color:#e8c4c4;text-decoration:none;border-radius:50px;letter-spacing:3px;font-size:.75rem;text-transform:uppercase;transition:.3s}
.back:hover{border-color:#d4a5a5;box-shadow:0 0 25px rgba(212,165,165,.15);transform:translateY(-2px)}
</style>
</head>
<body>
<div class="blur-spot"></div>
<video class="lilac-video" autoplay loop muted playsinline><source src="lilac.mp4" type="video/mp4"></video>
<div id="timeline">
  <div class="date">3 июня 2025 — 3 июня 2026</div>
  <h1>Тут будет времялина</h1>
  <p>Страница в разработке.<br>Здесь появится история ваших отношений.</p>
  <a href="clock.html" class="back">Вернуться</a>
</div>
</body>
</html>
