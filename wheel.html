<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо Фортуны</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#fff;height:100vh;width:100vw;overflow:hidden;position:relative}
.blur-spot{position:fixed;bottom:-180px;right:-180px;width:700px;height:700px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(120px);z-index:1;pointer-events:none}
.lilac-video{position:fixed;bottom:-40px;right:-40px;width:50vw;max-width:520px;z-index:2;pointer-events:none;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse 75% 75% at 65% 65%,black 30%,transparent 80%);mask-image:radial-gradient(ellipse 75% 75% at 65% 65%,black 30%,transparent 80%)}
@media(max-width:480px){.lilac-video{width:60vw;max-width:380px;bottom:-20px;right:-20px}.blur-spot{width:450px;height:450px;filter:blur(90px);bottom:-120px;right:-120px}}

/* Часы (фон, падают потом) */
#clock-bg{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;transition:transform 1s ease,opacity 1s ease}
#clock-bg.fall{transform:translateY(80vh) rotate(15deg);opacity:0}
.clock-wrap{position:relative;width:min(70vw,350px);height:min(70vw,350px);opacity:.25;filter:grayscale(1)}
.clock-wrap img{width:100%;height:100%;object-fit:contain}

/* Верёвки */
.rope{position:fixed;top:-30vh;width:24px;height:130vh;object-fit:cover;z-index:14;opacity:.9}
.rope-left{left:calc(50% - min(42vw,220px));transform-origin:top center;animation:ropeSwing 2s ease-in-out infinite}
.rope-right{right:calc(50% - min(42vw,220px));transform-origin:top center;animation:ropeSwing 2s ease-in-out infinite .3s}
@keyframes ropeSwing{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}

/* Контейнер колеса */
.wheel-box{position:fixed;top:50%;left:50%;width:min(84vw,440px);height:min(84vw,440px);transform:translate(-50%,-50%) translateY(-120vh);z-index:15;animation:wheelDrop 1.8s cubic-bezier(.25,.46,.45,.94) forwards}
@keyframes wheelDrop{0%{transform:translate(-50%,-50%) translateY(-120vh)}60%{transform:translate(-50%,-50%) translateY(15px)}75%{transform:translate(-50%,-50%) translateY(-8px)}90%{transform:translate(-50%,-50%) translateY(4px)}100%{transform:translate(-50%,-50%) translateY(0)}}

/* SVG колеса */
.wheel-svg{width:100%;height:100%;filter:drop-shadow(0 10px 40px rgba(0,0,0,.8))}
.wheel-group{transform-origin:center}
.pin{fill:#444;transition:fill .08s,filter .08s}
.pin.lit{fill:#fff;filter:drop-shadow(0 0 10px #fff)}

/* Стрелка */
.arrow-box{position:fixed;top:calc(50% - min(42vw,220px) - 28px);left:50%;transform:translateX(-50%);z-index:20;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.arrow-box svg{width:36px;height:40px}

/* Кнопка Крутить */
.spin-btn-wrap{position:fixed;top:calc(50% + min(42vw,220px) + 30px);left:50%;transform:translateX(-50%) translateY(-30px);z-index:20;opacity:0;transition:opacity .8s ease,transform .8s ease;pointer-events:none}
.spin-btn-wrap.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.spin-btn-wrap .rope-btn{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:4px;height:40px;background:linear-gradient(to bottom,#c4a882,#8b7355);border-radius:2px}
.spin-btn{display:inline-block;padding:16px 50px;border:2px solid #d4a5a5;color:#e8c4c4;background:rgba(10,10,15,.85);text-decoration:none;border-radius:50px;font-size:.9rem;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.3s;font-family:serif}
.spin-btn:hover{border-color:#e8c4c4;box-shadow:0 0 30px rgba(212,165,165,.2);transform:translateY(-2px)}
.spin-btn:disabled{opacity:.5;cursor:not-allowed}

/* Результат */
.result-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,15,.75);z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1s ease}
.result-overlay.show{opacity:1;pointer-events:auto}
.result-text{font-family:serif;font-size:clamp(1.8rem,6vw,3rem);color:#e8c4c4;text-align:center;margin-bottom:40px;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.result-emoji{font-size:4rem;margin-bottom:20px}
.continue-btn{display:inline-block;padding:14px 45px;border:1px solid rgba(212,165,165,.4);color:#e8c4c4;background:rgba(10,10,15,.9);text-decoration:none;border-radius:50px;letter-spacing:3px;font-size:.8rem;text-transform:uppercase;transition:.3s}
.continue-btn:hover{border-color:#d4a5a5;box-shadow:0 0 30px rgba(212,165,165,.15);transform:translateY(-2px)}

/* Затемнение колеса после прокрута */
.wheel-dim{transition:filter 1s ease}
.wheel-dim.dimmed{filter:brightness(.35)}
</style>
</head>
<body>
<div class="blur-spot"></div>
<video class="lilac-video" autoplay loop muted playsinline><source src="lilac.mp4" type="video/mp4"></video>

<!-- Фоновые часы (падают) -->
<div id="clock-bg">
  <div class="clock-wrap">
    <img src="clock.png" alt="">
  </div>
</div>

<!-- Верёвки -->
<img src="rope.png" class="rope rope-left" alt="">
<img src="rope.png" class="rope rope-right" alt="">

<!-- Стрелка -->
<div class="arrow-box">
  <svg viewBox="0 0 36 40"><polygon points="18,0 0,40 18,32 36,40" fill="#d4a5a5"/></svg>
</div>

<!-- Колесо -->
<div class="wheel-box wheel-dim" id="wheelBox">
  <svg class="wheel-svg" viewBox="0 0 500 500" id="wheelSvg">
    <defs>
      <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g class="wheel-group" id="wheelGroup" transform="translate(250,250)">
      <!-- Секторы будут здесь -->
    </g>
    <!-- Центр колеса -->
    <circle cx="250" cy="250" r="45" fill="#1a1510" stroke="#d4a5a5" stroke-width="2"/>
    <circle cx="250" cy="250" r="20" fill="#0a0a0f"/>
  </svg>
</div>

<!-- Кнопка Крутить -->
<div class="spin-btn-wrap" id="spinBtnWrap">
  <div class="rope-btn"></div>
  <button class="spin-btn" id="spinBtn" onclick="startSpin()">Крутить</button>
</div>

<!-- Результат -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-emoji" id="resultEmoji"></div>
  <div class="result-text" id="resultText"></div>
  <a href="timeline.html" class="continue-btn">Продолжить</a>
</div>

<script>
// Сектора (перемешиваются при загрузке)
const sectorsBase=[
  {text:'Тест',emoji:'✅',color:'#e74c3c'},
  {text:'Банан',emoji:'😱',color:'#f39c12'},
  {text:'Карта',emoji:'🦯',color:'#27ae60'},
  {text:'Купон',emoji:'🤫',color:'#8e44ad'},
  {text:'Стата',emoji:'💫',color:'#2980b9'}
];
const sectors=[...sectorsBase].sort(()=>Math.random()-.5);
const segAngle=360/sectors.length;
const wheelGroup=document.getElementById('wheelGroup');
const wheelBox=document.getElementById('wheelBox');
const spinBtn=document.getElementById('spinBtn');
const spinBtnWrap=document.getElementById('spinBtnWrap');
const clockBg=document.getElementById('clock-bg');
const resultOverlay=document.getElementById('resultOverlay');
const resultText=document.getElementById('resultText');
const resultEmoji=document.getElementById('resultEmoji');

// Рисуем колесо
const radius=200;
const pinRadius=radius+12;
const pins=[];

sectors.forEach((s,i)=>{
  const start=(i*segAngle)*Math.PI/180;
  const end=((i+1)*segAngle)*Math.PI/180;
  const x1=Math.cos(start)*radius,y1=Math.sin(start)*radius;
  const x2=Math.cos(end)*radius,y2=Math.sin(end)*radius;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',`M 0 0 L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`);
  path.setAttribute('fill',s.color);
  path.setAttribute('stroke','#0a0a0f');
  path.setAttribute('stroke-width','3');
  wheelGroup.appendChild(path);

  // Текст сектора
  const midAngle=(i*segAngle+segAngle/2)*Math.PI/180;
  const tx=Math.cos(midAngle)*(radius*.62);
  const ty=Math.sin(midAngle)*(radius*.62);
  const text=document.createElementNS('http://www.w3.org/2000/svg','text');
  text.setAttribute('x',tx);
  text.setAttribute('y',ty);
  text.setAttribute('text-anchor','middle');
  text.setAttribute('dominant-baseline','middle');
  text.setAttribute('fill','#fff');
  text.setAttribute('font-size','22');
  text.setAttribute('font-family','serif');
  text.setAttribute('font-weight','bold');
  text.setAttribute('transform',`rotate(${i*segAngle+segAngle/2+90},${tx},${ty})`);
  text.textContent=s.text;
  wheelGroup.appendChild(text);

  // Колышки по краям секторов
  for(let j=0;j<=1;j++){
    const a=((i+j)*segAngle)*Math.PI/180;
    const px=Math.cos(a)*pinRadius;
    const py=Math.sin(a)*pinRadius;
    const pin=document.createElementNS('http://www.w3.org/2000/svg','circle');
    pin.setAttribute('cx',px);
    pin.setAttribute('cy',py);
    pin.setAttribute('r','6');
    pin.setAttribute('class','pin');
    pin.setAttribute('data-angle',((i+j)*segAngle));
    wheelGroup.appendChild(pin);
    pins.push({el:pin,angle:(i+j)*segAngle});
  }
});

// Физика
let angle=0,velocity=0,isSpinning=false;
const friction=.982;
const minVel=.15;
const arrowAngle=270; // стрелка сверху (12 часов)

function updatePins(){
  const cur=(360-(angle%360)+arrowAngle)%360;
  pins.forEach(p=>{
    const diff=Math.abs(((p.angle-cur+540)%360)-180);
    if(diff<8)p.el.classList.add('lit');
    else p.el.classList.remove('lit');
  });
}

function animate(){
  if(!isSpinning)return;
  angle+=velocity;
  velocity*=friction;
  if(velocity<minVel){velocity=0;isSpinning=false;finishSpin();return;}
  wheelGroup.style.transform=`rotate(${angle}deg)`;
  updatePins();
  requestAnimationFrame(animate);
}

function startSpin(){
  if(isSpinning)return;
  spinBtn.disabled=true;
  velocity=18+Math.random()*22;
  isSpinning=true;
  animate();
}

function finishSpin(){
  const winAngle=(360-(angle%360)+arrowAngle)%360;
  const idx=Math.floor(winAngle/segAngle)%sectors.length;
  const winner=sectors[idx];

  setTimeout(()=>{
    wheelBox.classList.add('dimmed');
    resultEmoji.textContent=winner.emoji;
    resultText.innerHTML=`Выпало:<br><span style="color:${winner.color}">${winner.text}</span>`;
    resultOverlay.classList.add('show');
  },600);
}

// Часы падают через секунду после загрузки
setTimeout(()=>{clockBg.classList.add('fall');},1000);
// Кнопка появляется через 2.2с
setTimeout(()=>{spinBtnWrap.classList.add('show');},2200);
</script>
</body>
</html>
