<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо Фортуны</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#fff;height:100vh;width:100vw;overflow:hidden;position:relative}
.blur-spot{position:fixed;bottom:-180px;right:-180px;width:700px;height:700px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(120px);z-index:1;pointer-events:none}
.lilac-video{position:fixed;bottom:-40px;right:-40px;width:50vw;max-width:520px;z-index:2;pointer-events:none;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse 75% 75% at 65% 65%,black 30%,transparent 80%);mask-image:radial-gradient(ellipse 75% 75% at 65% 65%,black 30%,transparent 80%)}
@media(max-width:480px){.lilac-video{width:60vw;max-width:380px;bottom:-20px;right:-20px}.blur-spot{width:450px;height:450px;filter:blur(90px);bottom:-120px;right:-120px}}

/* Часы — обычные, видимые */
#clock-real{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;transition:transform 1.4s cubic-bezier(.4,0,.2,1),opacity 1s ease}
.clock-wrap{position:relative;width:min(80vw,400px);height:min(80vw,400px)}
.clock-wrap img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 20px rgba(0,0,0,.5))}
.year-img{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:60px;height:auto}
.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:4px;box-shadow:2px 2px 5px rgba(0,0,0,.3)}
.hh{width:4px;height:26%;background:#1a1510;margin-left:-2px;transform:rotate(232deg);border-radius:3px 3px 0 0}
.hm{width:2.5px;height:35%;background:#1a1510;margin-left:-1.25px;transform:rotate(278deg);border-radius:2px 2px 0 0}
.hs{width:1.5px;height:38%;background:#3a2010;margin-left:-.75px;transform:rotate(195deg);opacity:.85}
.dot{position:absolute;width:10px;height:10px;background:#1a1510;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}

/* Тряска экрана */
@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-4px,3px)}20%{transform:translate(4px,-3px)}30%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}50%{transform:translate(-2px,1px)}60%{transform:translate(2px,-1px)}70%{transform:translate(-1px,.5px)}80%{transform:translate(1px,-.5px)}90%{transform:translate(0,0)}}
body.shaking{animation:shake .5s ease}

/* Контейнер колеса + верёвок — всё вместе */
.wheel-container{position:fixed;top:50%;left:50%;width:min(80vw,400px);height:min(80vw,400px);transform:translate(-50%,-50%) translateY(-130vh);z-index:15}
.wheel-container.drop{animation:wheelDrop 2.2s cubic-bezier(.25,.46,.45,.94) forwards}
@keyframes wheelDrop{
  0%{transform:translate(-50%,-50%) translateY(-130vh)}
  55%{transform:translate(-50%,-50%) translateY(0)} /* удар */
  65%{transform:translate(-50%,-50%) translateY(-12px)} /* отскок */
  75%{transform:translate(-50%,-50%) translateY(5px)}
  85%{transform:translate(-50%,-50%) translateY(-3px)}
  100%{transform:translate(-50%,-50%) translateY(0)}
}
.wheel-container.settle{animation:settle 1.5s ease forwards}
@keyframes settle{0%{transform:translate(-50%,-50%) translateY(0)}100%{transform:translate(-50%,-50%) translateY(12vh)}}
.wheel-container.swing{animation:swing 4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:translate(-50%,-50%) translateY(12vh) rotate(-1deg)}50%{transform:translate(-50%,-50%) translateY(12vh) rotate(1deg)}}

/* Верёвки — встроены в контейнер, заканчиваются в колесе */
.rope{position:absolute;top:-55vh;left:50%;width:18px;height:75vh;object-fit:cover;opacity:.9;transform:translateX(-50%)}
.rope-left{left:5%;transform:translateX(-50%)}
.rope-right{left:95%;transform:translateX(-50%)}

/* SVG колеса */
.wheel-svg{width:100%;height:100%;filter:drop-shadow(0 8px 30px rgba(0,0,0,.7))}
#wheelGroup{transform-origin:center}
.pin{fill:#555;transition:fill .06s,filter .06s}
.pin.lit{fill:#fff;filter:drop-shadow(0 0 8px #fff)}

/* Стрелка — смотрит ВНИЗ, над колесом */
.arrow-box{position:fixed;top:calc(50% - min(40vw,200px) - 50px);left:50%;transform:translateX(-50%);z-index:20;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.arrow-box svg{width:32px;height:36px}

/* Кнопка Крутить */
.spin-btn-wrap{position:fixed;top:calc(50% + min(40vw,200px) + 35px);left:50%;transform:translateX(-50%) translateY(20px);z-index:20;opacity:0;transition:opacity .8s ease,transform .8s ease;pointer-events:none}
.spin-btn-wrap.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.spin-btn-wrap .rope-btn{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:3px;height:30px;background:linear-gradient(to bottom,#c4a882,#8b7355);border-radius:2px}
.spin-btn{display:inline-block;padding:14px 45px;border:2px solid #d4a5a5;color:#e8c4c4;background:rgba(10,10,15,.9);border-radius:50px;font-size:.85rem;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.3s;font-family:serif}
.spin-btn:hover{border-color:#e8c4c4;box-shadow:0 0 25px rgba(212,165,165,.2);transform:translateY(-2px)}
.spin-btn:disabled{opacity:.5;cursor:not-allowed}

/* Результат */
.result-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,15,.8);z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1s ease}
.result-overlay.show{opacity:1;pointer-events:auto}
.result-emoji{font-size:3.5rem;margin-bottom:15px}
.result-text{font-family:serif;font-size:clamp(1.6rem,5vw,2.5rem);color:#e8c4c4;text-align:center;margin-bottom:35px;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.continue-btn{display:inline-block;padding:12px 40px;border:1px solid rgba(212,165,165,.4);color:#e8c4c4;background:rgba(10,10,15,.9);text-decoration:none;border-radius:50px;letter-spacing:3px;font-size:.75rem;text-transform:uppercase;transition:.3s}
.continue-btn:hover{border-color:#d4a5a5;box-shadow:0 0 25px rgba(212,165,165,.15);transform:translateY(-2px)}

/* Затемнение */
.wheel-dim{transition:filter 1s ease}
.wheel-dim.dimmed{filter:brightness(.3)}
</style>
</head>
<body>
<div class="blur-spot"></div>
<video class="lilac-video" autoplay loop muted playsinline><source src="lilac.mp4" type="video/mp4"></video>

<!-- Часы (видны, не затемнённые) -->
<div id="clock-real">
  <div class="clock-wrap">
    <img src="clock.png" alt="">
    <img src="year2026.png" alt="" class="year-img">
    <div class="hand hh"></div><div class="hand hm"></div><div class="hand hs"></div>
    <div class="dot"></div>
  </div>
</div>

<!-- Стрелка ВНИЗ -->
<div class="arrow-box">
  <svg viewBox="0 0 32 36"><polygon points="16,36 0,0 16,12 32,0" fill="#d4a5a5"/></svg>
</div>

<!-- Колесо + верёвки — один контейнер -->
<div class="wheel-container wheel-dim" id="wheelContainer">
  <img src="rope.png" class="rope rope-left" alt="">
  <img src="rope.png" class="rope rope-right" alt="">
  <svg class="wheel-svg" viewBox="0 0 500 500" id="wheelSvg">
    <g id="wheelGroup">
      <!-- Секторы JS -->
    </g>
    <circle cx="250" cy="250" r="40" fill="#1a1510" stroke="#d4a5a5" stroke-width="2"/>
    <circle cx="250" cy="250" r="16" fill="#0a0a0f"/>
  </svg>
</div>

<!-- Кнопка -->
<div class="spin-btn-wrap" id="spinBtnWrap">
  <div class="rope-btn"></div>
  <button class="spin-btn" id="spinBtn" onclick="startSpin()">Крутить</button>
</div>

<!-- Результат -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-emoji" id="resultEmoji"></div>
  <div class="result-text" id="resultText"></div>
  <a href="timeline.html" class="continue-btn">Продолжить</a>
</div>

<script>
const sectorsBase=[
  {text:'Тест',emoji:'✅',color:'#e74c3c'},
  {text:'Банан',emoji:'😱',color:'#f39c12'},
  {text:'Карта воспоминаний',emoji:'🦯',color:'#27ae60'},
  {text:'Купон',emoji:'🤫',color:'#8e44ad'},
  {text:'Стата вся',emoji:'💫',color:'#2980b9'}
];
const sectors=[...sectorsBase].sort(()=>Math.random()-.5);
const segAngle=360/sectors.length;
const wheelGroup=document.getElementById('wheelGroup');
const wheelContainer=document.getElementById('wheelContainer');
const clockReal=document.getElementById('clock-real');
const spinBtn=document.getElementById('spinBtn');
const spinBtnWrap=document.getElementById('spinBtnWrap');
const resultOverlay=document.getElementById('resultOverlay');
const resultText=document.getElementById('resultText');
const resultEmoji=document.getElementById('resultEmoji');

// Рисуем колесо
const radius=200;
const pinRadius=radius+12;
const pins=[];

sectors.forEach((s,i)=>{
  const startA=(i*segAngle-90)*Math.PI/180;
  const endA=((i+1)*segAngle-90)*Math.PI/180;
  const x1=250+Math.cos(startA)*radius,y1=250+Math.sin(startA)*radius;
  const x2=250+Math.cos(endA)*radius,y2=250+Math.sin(endA)*radius;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',`M 250 250 L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`);
  path.setAttribute('fill',s.color);
  path.setAttribute('stroke','#0a0a0f');
  path.setAttribute('stroke-width','3');
  wheelGroup.appendChild(path);

  const midA=(i*segAngle+segAngle/2-90)*Math.PI/180;
  const tx=250+Math.cos(midA)*(radius*.58);
  const ty=250+Math.sin(midA)*(radius*.58);
  const text=document.createElementNS('http://www.w3.org/2000/svg','text');
  text.setAttribute('x',tx);
  text.setAttribute('y',ty);
  text.setAttribute('text-anchor','middle');
  text.setAttribute('dominant-baseline','middle');
  text.setAttribute('fill','#fff');
  text.setAttribute('font-size','16');
  text.setAttribute('font-family','serif');
  text.setAttribute('font-weight','bold');
  text.setAttribute('transform',`rotate(${i*segAngle+segAngle/2},${tx},${ty})`);
  text.textContent=s.text;
  wheelGroup.appendChild(text);

  for(let j=0;j<=1;j++){
    const a=((i+j)*segAngle-90)*Math.PI/180;
    const px=250+Math.cos(a)*pinRadius;
    const py=250+Math.sin(a)*pinRadius;
    const pin=document.createElementNS('http://www.w3.org/2000/svg','circle');
    pin.setAttribute('cx',px);
    pin.setAttribute('cy',py);
    pin.setAttribute('r','5');
    pin.setAttribute('class','pin');
    wheelGroup.appendChild(pin);
    pins.push({el:pin,angle:(i+j)*segAngle});
  }
});

// Вращение через CSS transform-origin:center
let angle=0,velocity=0,isSpinning=false;
const friction=.985;
const minVel=.1;

function updatePins(){
  const cur=(angle%360+360)%360;
  pins.forEach(p=>{
    const diff=Math.abs(((p.angle-cur+540)%360)-180);
    if(diff<5)p.el.classList.add('lit');
    else p.el.classList.remove('lit');
  });
}

function animate(){
  if(!isSpinning)return;
  angle+=velocity;
  velocity*=friction;
  if(velocity<minVel){velocity=0;isSpinning=false;finishSpin();return;}
  wheelGroup.style.transform=`rotate(${angle}deg)`;
  updatePins();
  requestAnimationFrame(animate);
}

function startSpin(){
  if(isSpinning)return;
  spinBtn.disabled=true;
  velocity=18+Math.random()*16;
  isSpinning=true;
  animate();
}

function finishSpin(){
  const cur=(angle%360+360)%360;
  const idx=Math.floor(((360-cur)%360)/segAngle)%sectors.length;
  const winner=sectors[idx];
  setTimeout(()=>{
    wheelContainer.classList.add('dimmed');
    resultEmoji.textContent=winner.emoji;
    resultText.innerHTML=`Выпало:<br><span style="color:${winner.color}">${winner.text}</span>`;
    resultOverlay.classList.add('show');
  },500);
}

// Сценарий анимации
// 1. Колесо падает
setTimeout(()=>{wheelContainer.classList.add('drop');},400);
// 2. Удар — тряска + часы подкашиваются и падают
setTimeout(()=>{
  document.body.classList.add('shaking');
  clockReal.style.transform='translateY(20px) rotate(8deg)';
  setTimeout(()=>{document.body.classList.remove('shaking');},500);
},1500);
// 3. Часы падают окончательно
setTimeout(()=>{
  clockReal.style.transition='transform 1s ease,opacity .8s ease';
  clockReal.style.transform='translateY(120vh) rotate(25deg)';
  clockReal.style.opacity='0';
},2200);
// 4. Колесо опускается на место часов
setTimeout(()=>{
  wheelContainer.classList.remove('drop');
  wheelContainer.classList.add('settle');
},2400);
// 5. Колесо покачивается + кнопка появляется
setTimeout(()=>{
  wheelContainer.classList.remove('settle');
  wheelContainer.classList.add('swing');
  spinBtnWrap.classList.add('show');
},3900);
</script>
</body>
</html>
